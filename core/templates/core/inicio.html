
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedal Office</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f7f8fa;
            font-family: Arial, sans-serif;
        }

        .card-principal {
            max-width: 460px;
            border-radius: 22px;
        }

        .titulo {
            font-weight: 800;
        }

        .pedal {
            color: #e53935;
        }

        .office {
            color: #f59e0b;
        }

        .botao-catalogo {
            display: block;
            background-color: #e53935;
            color: #ffffff;
            border: 2px solid #e53935;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .botao-catalogo:hover {
            background-color: #c62828;
            color: #ffffff;
        }

        .botao-acesso {
            display: block;
            background-color: #ffffff;
            color: #f97316;
            border: 2px solid #f97316;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .botao-acesso:hover {
            background-color: #fff7ed;
            color: #ea580c;
        }

        .status {
            color: #6c757d;
        }
    </style>
</head>

<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="card card-principal border-0 shadow-lg w-100">
            <div class="card-body text-center p-4 p-md-5">

                <div class="mb-3" style="font-size: 3.5rem;">
                    🚲
                </div>

                <h1 class="titulo mb-4">
                    <span class="pedal">Pedal</span>
                    <span class="office">Office</span>
                </h1>

                <h2 class="h5 fw-semibold">
                    Bem-vindo ao Pedal Office!
                </h2>

                <p class="text-secondary small mb-4">
                    Gerencie produtos, estoque e vendas
                    de maneira simples e organizada.
                </p>

                <button class="botao-catalogo w-100 mb-3" disabled>
                    Ver catálogo
                </button>

                <button class="botao-acesso w-100" disabled>
                    Acessar o sistema
                </button>

                <p class="status small mt-4 mb-0">
                    Em desenvolvimento
                </p>

            </div>
        </div>
    </main>
</body>
</html>
